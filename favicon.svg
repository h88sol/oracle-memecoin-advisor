    <!-- needle tip -->
    <line x1="32" y1="128" x2="74" y2="128"/>
    <!-- nozzle / bevel -->
    <path d="M 74 118 L 88 118 L 88 138 L 74 138 Z"/>
    <!-- chamber body -->
