<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3a0c0c"/>
      <stop offset="55%" stop-color="#180405"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a1414"/>
      <stop offset="100%" stop-color="#3a0707"/>
    </linearGradient>
  </defs>

  <!-- bg with subtle red ember glow -->
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- syringe: rotated -35deg around centre -->
  <g transform="rotate(-35 128 128)" fill="none" stroke="#9a1f25" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- needle tip (thin long line) -->
    <line x1="20" y1="128" x2="80" y2="128" stroke-width="2.6"/>
    <!-- nozzle bevel -->
    <path d="M 80 122 L 92 122 L 92 134 L 80 134 Z"/>
    <!-- chamber body (tall barrel) -->
    <path d="M 92 102 L 184 102 L 184 154 L 92 154 Z"/>
    <!-- liquid fill (lower part of chamber) -->
    <path d="M 96 122 L 156 122 L 156 150 L 96 150 Z" fill="url(#liquid)" stroke="none"/>
    <!-- chamber flange (thin vertical at right end) -->
    <line x1="184" y1="92" x2="184" y2="164"/>
    <!-- plunger rod -->
    <line x1="184" y1="128" x2="218" y2="128" stroke-width="3"/>
    <!-- plunger thumb-rest (small flat top) -->
    <line x1="218" y1="116" x2="218" y2="140"/>
  </g>
</svg>
