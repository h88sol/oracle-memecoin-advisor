    <rect x="94" y="120" width="58" height="32" rx="1" fill="#751515" stroke="none"/>
    <!-- chamber flange -->
    <line x1="190" y1="90" x2="190" y2="166"/>
    <!-- plunger rod -->
    <line x1="190" y1="128" x2="220" y2="128"/>
    <!-- plunger thumb rest -->
